name: ECSP checksum-locked archive packaging
on:
  push:
    branches: [ecsp-selfcontained-148-build]
    paths:
      - '.github/workflows/ecsp-bundle-build.yml'
      - 'bundle_upload/READY'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Packaging environment
        run: python -c "import sys,zlib; print(sys.version); print('zlib',zlib.ZLIB_RUNTIME_VERSION)"
      - name: Reconstruct and verify frozen bytes
        if: hashFiles('bundle_upload/READY') != ''
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 shapely==2.1.2 scikit-image==0.26.0 opencv-python-headless==4.13.0.92
          python bundle_upload/build_archive.py
      - name: Publish only verified archive to staging branch
        if: hashFiles('bundle_upload/READY') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/image_design/frozen143_geometry.zip bundle_upload/verified.json
          git commit -m 'Store byte-identical frozen 143 geometry archive after SHA-256 verification'
          git push origin HEAD:ecsp-selfcontained-148-build
